name: Weekly Progress Report Auto-Commit

on:
  schedule:
    - cron: '29 18 * * 4'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install reportlab matplotlib

      - name: Generate historical weekly reports
        run: |
          python generate_report.py weekly

      - name: Commit reports with Thursday dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in weekly_reports/*_Weekly_Progress_Report_Form-3_*.pdf; do
            [ -f "$file" ] || continue

            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "Already tracked: $file"
              continue
            fi

            report_date=$(basename "$file" | sed -E 's/.*_([0-9]{4}-[0-9]{2}-[0-9]{2})\.pdf/\1/')

            commit_date="${report_date}T23:59:00+05:30"

            git add "$file"

            GIT_AUTHOR_DATE="$commit_date" \
            GIT_COMMITTER_DATE="$commit_date" \
            git commit -m "Add weekly progress report for $report_date"

          done

          git push origin HEAD:main