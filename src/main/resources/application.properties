spring.application.name=gp-water-om-backend
server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/gp_water_om
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT config (used from Week 2)
jwt.secret=gpWaterOmSecretKeyForJwtTokenSigningChangeInProd123456
jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
logging.level.com.gpwater=DEBUG
